<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Việt Danh Học - Quản Lý & Lập Cục</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #fdfaf3;
            --bg-card: #fffdf9;
            --primary-red: #6e1414;
            --dark-red: #4a0b0b;
            --accent-gold: #c89d54;
            --gold-light: #e6cfa7;
            --text-dark: #2c221e;
            --text-muted: #6b5a52;
            --cat-color: #1b6b3a;
            --hung-color: #b02a2a;
            --ban-color: #b87314;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Serif', serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            line-height: 1.65;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 2px solid var(--accent-gold);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(74, 11, 11, 0.12);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, var(--dark-red) 0%, var(--primary-red) 100%);
            color: #fff;
            text-align: center;
            padding: 24px 20px 0 20px;
            border-bottom: 4px double var(--accent-gold);
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.1rem;
            color: #f7e1b5;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        header p {
            font-size: 0.95rem;
            color: var(--gold-light);
            font-style: italic;
            margin-bottom: 18px;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(0, 0, 0, 0.25);
            color: var(--gold-light);
            border: 1px solid var(--accent-gold);
            border-bottom: none;
            padding: 10px 22px;
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 6px 6px 0 0;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--bg-card);
            color: var(--primary-red);
        }

        .tab-content { display: none; padding: 26px; }
        .tab-content.active { display: block; }

        .main-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 26px;
        }

        @media (max-width: 920px) { .main-grid { grid-template-columns: 1fr; } }

        .panel-left {
            background: #faf4e8;
            border: 1px solid var(--gold-light);
            border-radius: 6px;
            padding: 20px;
            height: fit-content;
        }

        .panel-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            color: var(--primary-red);
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 8px;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 5px; color: var(--dark-red);
        }
        .form-group input, .form-group select {
            width: 100%; padding: 9px 12px; font-family: 'Noto Serif', serif;
            font-size: 1rem; border: 1px solid #c9b18c; border-radius: 4px; background: #fff;
        }

        .hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 3px; font-style: italic; }

        .btn-calc {
            width: 100%; background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
            color: #f7e1b5; font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 700;
            text-transform: uppercase; padding: 12px; border: 1px solid var(--accent-gold);
            border-radius: 4px; cursor: pointer; margin-top: 6px;
        }
        .btn-calc:hover { background: var(--dark-red); }

        .btn-generate {
            width: 100%; background: #1b6b3a; color: #fff; font-family: 'Noto Serif', serif;
            font-size: 0.88rem; font-weight: 700; padding: 10px; border: none;
            border-radius: 4px; cursor: pointer; margin-top: 12px;
        }
        .btn-generate:hover { background: #134e2a; }

        .alpha-table {
            width: 100%; border-collapse: collapse; margin-top: 16px;
            font-size: 0.76rem; text-align: center; background: #fff;
        }
        .alpha-table th, .alpha-table td { border: 1px solid #dcc7a1; padding: 4px; }
        .alpha-table th { background: var(--primary-red); color: #f7e1b5; }

        .panel-right { display: flex; flex-direction: column; gap: 20px; }

        .summary-banner {
            background: #f9f1e2; border-left: 5px solid var(--primary-red);
            padding: 15px 18px; border-radius: 4px;
        }
        .letter-breakdown { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .word-chip {
            background: #fff; border: 1px solid var(--accent-gold);
            padding: 5px 12px; border-radius: 4px; font-size: 0.88rem;
        }

        .cuc-section {
            border: 1px solid #dfd0b8; border-radius: 6px;
            background: #fff; overflow: hidden;
        }
        .cuc-header {
            background: linear-gradient(90deg, #5c1010, #871f1f); color: #f7e1b5;
            padding: 11px 18px; display: flex; justify-content: space-between; align-items: center;
        }
        .cuc-header h2 { font-family: 'Playfair Display', serif; font-size: 1.2rem; }
        .cuc-desc-bar {
            background: #f5ebd9; padding: 8px 18px; font-size: 0.84rem;
            color: #54433a; border-bottom: 1px solid #e2d2b5; font-style: italic;
        }
        .cuc-body { padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 680px) { .cuc-body { grid-template-columns: 1fr; } }

        .sub-cuc-card {
            border: 1px solid #e6d8c3; border-radius: 6px; padding: 14px; background: #fffdf9;
        }
        .sub-cuc-title {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px dashed #d6c3a5; padding-bottom: 8px; margin-bottom: 10px;
        }
        .sub-cuc-title h3 { font-size: 1rem; color: var(--primary-red); }
        
        .cuc-number-badge {
            background: var(--primary-red); color: #f7e1b5; font-weight: 700;
            padding: 3px 10px; border-radius: 20px; font-size: 0.9rem;
            border: 1px solid var(--accent-gold); cursor: pointer;
        }
        .formula-line {
            font-size: 0.82rem; color: #66554b; background: #f4eee4;
            padding: 6px 10px; border-radius: 4px; margin-bottom: 10px; font-family: monospace;
        }

        .badge-loai {
            display: inline-block; padding: 2px 8px; border-radius: 4px;
            font-size: 0.75rem; font-weight: 700; color: #fff; margin-left: 6px;
        }
        .bg-cat { background-color: var(--cat-color); }
        .bg-hung { background-color: var(--hung-color); }
        .bg-ban { background-color: var(--ban-color); }
        .bg-none { background-color: #777; }

        .part-block {
            background: #faf6ee; border-left: 4px solid var(--accent-gold);
            padding: 10px 12px; margin-top: 8px; border-radius: 0 4px 4px 0;
        }
        .part-block-title {
            font-weight: 700; font-size: 0.82rem; color: var(--primary-red);
            text-transform: uppercase; margin-bottom: 6px;
        }
        .detail-item { margin-bottom: 6px; font-size: 0.88rem; }
        .detail-item strong { color: #3d2a23; }

        .tuong-quan-box {
            grid-column: 1 / -1; background: #fff6e5; border: 1px solid var(--accent-gold);
            padding: 12px 15px; border-radius: 5px; font-size: 0.88rem;
        }
        .btn-open-page {
            display: inline-block; margin-top: 10px; font-size: 0.8rem;
            color: #165682; font-weight: 700; text-decoration: underline;
            cursor: pointer; background: none; border: none; font-family: inherit;
        }
        .btn-open-page:hover { color: var(--primary-red); }

        .grid-81 { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-top: 16px; }
        .cuc-grid-item {
            border: 1px solid #dfd0b8; border-radius: 6px; padding: 12px; background: #fff;
            cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; justify-content: space-between;
        }
        .cuc-grid-item:hover { border-color: var(--primary-red); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .cuc-grid-item.has-data { background: #f6fff8; border-color: #8fd1a6; }

        .single-cuc-page {
            max-width: 820px; margin: 0 auto; background: #fff;
            border: 2px solid var(--accent-gold); border-radius: 8px; padding: 28px;
        }
        .file-path-tag {
            display: inline-block; background: #2c221e; color: #f7e1b5; font-family: monospace;
            padding: 4px 10px; border-radius: 4px; font-size: 0.85rem; margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Việt Danh Học – Tứ Đại Cục</h1>
        <p>Hệ thống lập cục và quản lý 81 cục theo phương pháp Cao Từ Linh</p>
        <div class="nav-tabs">
            <button class="tab-btn active" id="btnTabCalc" onclick="chuyenTab('tabCalc')">1. Tính Tên & Luận Giải</button>
            <button class="tab-btn" id="btnTabList" onclick="chuyenTab('tabList')">2. Danh Sách 81 Cục (Quản Lý)</button>
            <button class="tab-btn" id="btnTabSingle" onclick="chuyenTab('tabSingle')">3. Trang Chi Tiết Từng Cục</button>
        </div>
    </header>

    <!-- TAB 1: TÍNH TÊN -->
    <div class="tab-content active" id="tabCalc">
        <div class="main-grid">
            <div class="panel-left">
                <h2 class="panel-title">Nhập Thông Tin</h2>
                
                <div class="form-group">
                    <label for="hoInput">1. Họ (Chỉ tính Họ đơn):</label>
                    <input type="text" id="hoInput" value="Phạm" placeholder="VD: Phạm">
                </div>

                <div class="form-group">
                    <label for="demInput">2. Tên Đệm (Có thể trống):</label>
                    <input type="text" id="demInput" value="Ngọc" placeholder="VD: Ngọc">
                </div>

                <div class="form-group">
                    <label for="tenInput">3. Tên Riêng:</label>
                    <input type="text" id="tenInput" value="Huỳnh" placeholder="VD: Huỳnh">
                </div>

                <div class="form-group">
                    <label for="gioiTinh">4. Giới tính:</label>
                    <select id="gioiTinh">
                        <option value="nam" selected>Nam nhân</option>
                        <option value="nu">Nữ nhân</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="hanhKhuyet">5. Hằng số (Hành khuyết):</label>
                    <select id="hanhKhuyet">
                        <option value="thuy">Hành Thủy (Nam 1 / Nữ 6)</option>
                        <option value="hoa" selected>Hành Hỏa (Nam 7 / Nữ 2)</option>
                        <option value="moc">Hành Mộc (Nam 3 / Nữ 8)</option>
                        <option value="kim">Hành Kim (Nam 9 / Nữ 4)</option>
                        <option value="tho">Hành Thổ (Nam 5 / Nữ 10)</option>
                    </select>
                    <div class="hint">Dùng bù số khi Tên không có Đệm.</div>
                </div>

                <button class="btn-calc" onclick="tinhTuDaiCuc()">Lập Cục & Luận Giải</button>

                <button class="btn-generate" onclick="taoTuDong81File()">
                    📁 Tự Động Tạo Thư Mục cuc/
                </button>

                <table class="alpha-table">
                    <thead><tr><th colspan="8">Bảng Chữ Cái Việt Nam</th></tr></thead>
                    <tbody>
                        <tr><td><b>A</b>:1</td><td><b>B</b>:2</td><td><b>C</b>:3</td><td><b>D</b>:4</td><td><b>Đ</b>:5</td><td><b>E</b>:6</td><td><b>G</b>:7</td><td><b>H</b>:8</td></tr>
                        <tr><td><b>I</b>:9</td><td><b>K</b>:10</td><td><b>L</b>:11</td><td><b>M</b>:12</td><td><b>N</b>:13</td><td><b>O</b>:14</td><td><b>P</b>:15</td><td><b>Q</b>:16</td></tr>
                        <tr><td><b>R</b>:17</td><td><b>S</b>:18</td><td><b>T</b>:19</td><td><b>U</b>:20</td><td><b>V</b>:21</td><td><b>X</b>:22</td><td><b>Y</b>:23</td><td>-</td></tr>
                        <tr><td colspan="2"><b>F</b>:24</td><td colspan="2"><b>J</b>:25</td><td colspan="2"><b>W</b>:26</td><td colspan="2"><b>Z</b>:27</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="panel-right" id="resultArea"></div>
        </div>
    </div>

    <!-- TAB 2 & 3 -->
    <div class="tab-content" id="tabList">
        <div class="summary-banner">
            <h3 style="color:var(--primary-red); font-family:'Playfair Display',serif;">Quản Lý Toàn Bộ 81 Cục</h3>
        </div>
        <div class="grid-81" id="grid81Area"></div>
    </div>
    <div class="tab-content" id="tabSingle"><div id="singleCucArea"></div></div>
</div>

<script>
window.DATA_81_CUC = {};

function nap81FileCuc() {
    let loadedOrFailed = 0;
    for (let i = 1; i <= 81; i++) {
        const s = document.createElement('script');
        s.src = `cuc/cuc${i}.js`;
        s.onload = () => { loadedOrFailed++; if (loadedOrFailed === 81) capNhatToanBoGiaoDien(); };
        s.onerror = () => { loadedOrFailed++; if (loadedOrFailed === 81) capNhatToanBoGiaoDien(); };
        document.head.appendChild(s);
    }
}

const BANG_CHU_CAI = {
    'A':1, 'B':2, 'C':3, 'D':4, 'Đ':5, 'E':6, 'G':7, 'H':8,
    'I':9, 'K':10, 'L':11, 'M':12, 'N':13, 'O':14, 'P':15, 'Q':16,
    'R':17, 'S':18, 'T':19, 'U':20, 'V':21, 'X':22, 'Y':23,
    'F':24, 'J':25, 'W':26, 'Z':27
};

const HANG_SO_NGU_HANH = {
    thuy: { nam: 1, nu: 6, ten: "Hành Thủy" }, hoa: { nam: 7, nu: 2, ten: "Hành Hỏa" },
    moc: { nam: 3, nu: 8, ten: "Hành Mộc" }, kim: { nam: 9, nu: 4, ten: "Hành Kim" },
    tho: { nam: 5, nu: 10, ten: "Hành Thổ" }
};

function chuanHoaKyTu(char) {
    let upper = char.toUpperCase();
    if (upper === 'Đ' || upper === 'Ð') return 'Đ';
    return upper.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function phanTichTu(word) {
    let cleanWord = (word || "").trim();
    if (!cleanWord) return null;
    let nums = [], chars = [];
    for (let ch of cleanWord) {
        let baseChar = chuanHoaKyTu(ch);
        if (BANG_CHU_CAI[baseChar]) { nums.push(BANG_CHU_CAI[baseChar]); chars.push(ch.toUpperCase()); }
    }
    if (nums.length === 0) return null;
    let sum = nums.reduce((a, b) => a + b, 0);
    return { original: cleanWord.toUpperCase(), chars, nums, sum, first: nums[0], last: nums[nums.length - 1] };
}

function rutGon81(rawVal) {
    let val = rawVal; while (val > 81) val -= 80;
    return val <= 0 ? 1 : val;
}

function tinhDongCucCongDon(rawTotal) {
    let steps = [rawTotal], current = Math.abs(rawTotal);
    if (current >= 11 && current <= 99 && current % 11 === 0) {
        let digit = current / 11; steps.push(digit + " (Cục kép lấy " + digit + ")");
        return { final: digit, stepsStr: steps.join(' → ') };
    }
    while (current > 9) {
        let digits = String(current).split('').map(Number);
        current = digits.reduce((a, b) => a + b, 0); steps.push(current);
    }
    return { final: current, stepsStr: steps.join(' → ') };
}

function kiemTraCucDaCoDuLieu(soCuc) {
    const d = window.DATA_81_CUC[soCuc];
    if (!d) return false;
    const lc = d.luan_chung || {}, td = d.tinh_danh || {};
    return Boolean((d.ten && d.ten !== "") || d.mo_ta_chung || lc.can_co || lc.gia_dinh || lc.suc_khoe || lc.nghe_nghiep || lc.phuc_duc || lc.con_cai || lc.tien_hau_van || td.dien_thuc_phan_thuc || td.bat_tuong);
}

function layMauBadge(pl) {
    pl = (pl || "").toLowerCase();
    if (!pl) return "bg-none";
    if (pl.includes("đại cát") || (pl.includes("cát") && !pl.includes("hung"))) return "bg-cat";
    if (pl.includes("hung") && !pl.includes("cát") && !pl.includes("bán")) return "bg-hung";
    return "bg-ban";
}

// HÀM CHẮT LỌC THÔNG MINH CHO TỪNG CỤC
function renderChiTietCuc(soCuc, loaiCung) {
    const data = window.DATA_81_CUC[soCuc];
    if (!data || !kiemTraCucDaCoDuLieu(soCuc)) {
        return `<div style="margin-top:8px; font-size:0.9rem;">
            <div><strong>Cục số ${soCuc}:</strong> <em>(Chưa nhập nội dung)</em> <span class="badge-loai bg-none">Trống</span></div>
            <p class="hint">Mở file <b>cuc/cuc${soCuc}.js</b> để nhập nội dung cho cục này.</p>
        </div>`;
    }

    let badgeClass = layMauBadge(data.phan_loai);
    let tenKhac = data.ten_khac ? ` <span style="font-weight:normal; font-style:italic; color:#66554b;">(${data.ten_khac})</span>` : "";
    let html = `<div style="margin-top:8px; font-size:0.9rem;">
        <div style="font-weight:700; font-size:1rem; margin-bottom:6px;">
            Cục ${soCuc}: ${data.ten}${tenKhac} ${data.phan_loai ? `<span class="badge-loai ${badgeClass}">${data.phan_loai}</span>` : ""}
        </div>`;

    const lc = data.luan_chung || {};
    const td = data.tinh_danh || {};

    if (loaiCung === "phuc_duc") {
        if (lc.phuc_duc) {
            html += `<div class="part-block" style="border-left-color: #1b6b3a;"><div class="detail-item"><strong>• Âm phần, mồ mả:</strong> ${lc.phuc_duc}</div></div>`;
        } else {
            html += `<em class="hint">(Sách không ghi rõ mục thế đất Phúc đức cho cục này)</em>`;
        }
    } 
    else if (loaiCung === "tu_tuc") {
        html += `<div class="part-block" style="border-left-color: #2b5c8f;">`;
        let hasTT = false;
        if (lc.can_co) { html += `<div class="detail-item"><strong>• Căn cơ:</strong> ${lc.can_co}</div>`; hasTT = true; }
        if (lc.con_cai) { html += `<div class="detail-item"><strong>• Luận con cái:</strong> ${lc.con_cai}</div>`; hasTT = true; }
        if (!hasTT) html += `<em class="hint">(Sách không luận về Căn cơ/Con cái cho cục này)</em>`;
        html += `</div>`;
    }
    else if (loaiCung === "van") {
        if (data.mo_ta_chung) html += `<p style="margin-bottom:8px;">${data.mo_ta_chung}</p>`;
        html += `<div class="part-block">`;
        if (lc.can_co) html += `<div class="detail-item"><strong>• Căn cơ:</strong> ${lc.can_co}</div>`;
        if (lc.tien_hau_van) html += `<div class="detail-item"><strong>• Xu thế vận trình:</strong> ${lc.tien_hau_van}</div>`;
        html += `</div>`;
    }
    else if (loaiCung === "menh") {
        if (data.mo_ta_chung) html += `<p style="margin-bottom:8px;">${data.mo_ta_chung}</p>`;
        html += `<div class="part-block">`;
        if (lc.can_co) html += `<div class="detail-item"><strong>• Căn cơ:</strong> ${lc.can_co}</div>`;
        if (lc.gia_dinh) html += `<div class="detail-item"><strong>• Gia đình:</strong> ${lc.gia_dinh}</div>`;
        if (lc.suc_khoe) html += `<div class="detail-item"><strong>• Sức khoẻ:</strong> ${lc.suc_khoe}</div>`;
        if (lc.nghe_nghiep) html += `<div class="detail-item"><strong>• Nghề nghiệp:</strong> ${lc.nghe_nghiep}</div>`;
        html += `</div>`;
        
        if (td.dien_thuc_phan_thuc || td.bat_tuong) {
            html += `<div class="part-block" style="border-left-color: var(--primary-red); background-color: #fdf3f3;">
                        <div class="part-block-title" style="color:var(--dark-red); font-size:0.9rem;">PHẦN TÍNH DANH (CHÚ Ý CỰC KỲ QUAN TRỌNG)</div>`;
            if (td.dien_thuc_phan_thuc) html += `<div class="detail-item"><strong>• Nếu Tên HỢP Mệnh (Điền thực):</strong> ${td.dien_thuc_phan_thuc}</div>`;
            if (td.bat_tuong) html += `<div class="detail-item"><strong>• Nếu Tên KHẮC Mệnh (Bất tương):</strong> ${td.bat_tuong}</div>`;
            html += `</div>`;
        }
    }
    else if (loaiCung === "full") {
        if (data.mo_ta_chung) html += `<p style="margin-bottom:8px;">${data.mo_ta_chung}</p>`;
        html += `<div class="part-block"><div class="part-block-title">Phần 1: Luận Chung</div>`;
        if (lc.can_co) html += `<div class="detail-item"><strong>• Căn cơ:</strong> ${lc.can_co}</div>`;
        if (lc.gia_dinh) html += `<div class="detail-item"><strong>• Gia đình:</strong> ${lc.gia_dinh}</div>`;
        if (lc.suc_khoe) html += `<div class="detail-item"><strong>• Sức khoẻ:</strong> ${lc.suc_khoe}</div>`;
        if (lc.nghe_nghiep) html += `<div class="detail-item"><strong>• Nghề nghiệp:</strong> ${lc.nghe_nghiep}</div>`;
        if (lc.phuc_duc) html += `<div class="detail-item"><strong>• Phúc đức:</strong> ${lc.phuc_duc}</div>`;
        if (lc.con_cai) html += `<div class="detail-item"><strong>• Con cái:</strong> ${lc.con_cai}</div>`;
        if (lc.tien_hau_van) html += `<div class="detail-item"><strong>• Tiền, hậu vận:</strong> ${lc.tien_hau_van}</div>`;
        html += `</div>`;
        if (td.dien_thuc_phan_thuc || td.bat_tuong) {
            html += `<div class="part-block" style="border-left-color: var(--primary-red);"><div class="part-block-title">Phần 2: Tính Danh</div>`;
            if (td.dien_thuc_phan_thuc) html += `<div class="detail-item"><strong>• Điền thực - Phản thực:</strong> ${td.dien_thuc_phan_thuc}</div>`;
            if (td.bat_tuong) html += `<div class="detail-item"><strong>• Bất tương:</strong> ${td.bat_tuong}</div>`;
            html += `</div>`;
        }
    }

    if (loaiCung !== "full") {
        html += `<button class="btn-open-page" onclick="moTrangRiengCuc(${soCuc})">➔ Đọc trọn bộ Cục ${soCuc} (Tất cả các mục)</button></div>`;
    } else {
        html += `</div>`;
    }

    return html;
}

function danhGiaTuongQuanMenh(soTinh, soDong) {
    const dTinh = window.DATA_81_CUC[soTinh], dDong = window.DATA_81_CUC[soDong];
    if (!dTinh || !dDong || !dTinh.phan_loai || !dDong.phan_loai) return `<em>(Chưa đủ dữ liệu để luận Tĩnh - Động)</em>`;
    const isTinhCat = dTinh.phan_loai.toLowerCase().includes("cát") && !dTinh.phan_loai.toLowerCase().includes("hung");
    const isDongCat = dDong.phan_loai.toLowerCase().includes("cát") && !dDong.phan_loai.toLowerCase().includes("hung");

    if (isTinhCat && isDongCat) return "<strong>Tĩnh cục Tốt + Động cục Tốt (Đại Cát):</strong> Áo gấm thêu hoa, gốc vững ngọn vượng.";
    if (isTinhCat && !isDongCat) return "<strong>Tĩnh cục Tốt + Động cục Xấu (Tốt chung xấu riêng):</strong> Mặt bằng chung ổn định, nhưng một số lĩnh vực cụ thể gặp trở ngại.";
    if (!isTinhCat && isDongCat) return "<strong>Tĩnh cục Xấu + Động cục Tốt (Xấu chung tốt riêng):</strong> Bình diện chung vất vả, nhưng có thể thăng tiến ở một số lĩnh vực riêng.";
    return "<strong>Tĩnh cục Xấu + Động cục Xấu (Đại Hung):</strong> Cần xét kỹ Phúc Đức Cục xem có âm phúc dòng họ cứu giải hay không.";
}

function tinhTuDaiCuc() {
    const rawHo = document.getElementById("hoInput").value.trim();
    const rawDem = document.getElementById("demInput").value.trim();
    const rawTen = document.getElementById("tenInput").value.trim();
    const gioiTinh = document.getElementById("gioiTinh").value;
    const hanhKey = document.getElementById("hanhKhuyet").value;

    if (!rawHo || !rawTen) { alert("Vui lòng nhập tối thiểu Họ và Tên riêng!"); return; }

    const hoObj = phanTichTu(rawHo.split(/\s+/)[0]);
    const demObjs = rawDem ? rawDem.split(/\s+/).filter(Boolean).map(w => phanTichTu(w)).filter(Boolean) : [];
    const coDem = demObjs.length > 0;
    const tenObj = phanTichTu(rawTen);
    if (!hoObj || !tenObj) return;

    const hangSo = HANG_SO_NGU_HANH[hanhKey][gioiTinh];
    const tenHanh = HANG_SO_NGU_HANH[hanhKey].ten;

    const tongHo = hoObj.sum, dauHo = hoObj.first, cuoiHo = hoObj.last;
    const tongTen = tenObj.sum, cuoiTen = tenObj.last;
    const tongDem = coDem ? demObjs.reduce((acc, d) => acc + d.sum, 0) : 0;
    const tongCuoiDem = coDem ? demObjs.reduce((acc, d) => acc + d.last, 0) : 0;
    const tongDauDem = coDem ? demObjs.reduce((acc, d) => acc + d.first, 0) : 0;

    const menhTinh = rutGon81(tongHo + tongDem + tongTen);
    const menhDong = rutGon81(cuoiHo + tongCuoiDem + tongTen);
    const tienVan = rutGon81(coDem ? (tongHo + tongCuoiDem + cuoiTen) : (tongHo + hangSo + cuoiTen));
    const hauVan = rutGon81(coDem ? (tongHo + tongCuoiDem + tongTen) : (tongHo + tongTen + hangSo));
    const phucTinh = rutGon81(coDem ? (cuoiHo + tongDem + cuoiTen) : (cuoiHo + hangSo + cuoiTen));
    const phucDongObj = tinhDongCucCongDon(coDem ? (cuoiHo + tongDem + cuoiTen) : (cuoiHo + hangSo + cuoiTen));
    const tuTinhRaw = dauHo + (coDem ? tongDauDem : hangSo) + tongTen + (gioiTinh === 'nam' ? 1 : -1);
    const tuTinh = rutGon81(tuTinhRaw);
    const tuDongObj = tinhDongCucCongDon(tuTinhRaw);

    let chipsHtml = `<div class="word-chip"><strong>HỌ (${hoObj.original}):</strong> ${hoObj.nums.join('+')} = <b>${hoObj.sum}</b> (Đầu:${hoObj.first}, Cuối:${hoObj.last})</div>`;
    if (coDem) demObjs.forEach(d => { chipsHtml += `<div class="word-chip"><strong>ĐỆM (${d.original}):</strong> ${d.nums.join('+')} = <b>${d.sum}</b> (Đầu:${d.first}, Cuối:${d.last})</div>`; });
    else chipsHtml += `<div class="word-chip"><strong>KHÔNG ĐỆM:</strong> Hằng số ${tenHanh} = <b>${hangSo}</b></div>`;
    chipsHtml += `<div class="word-chip"><strong>TÊN (${tenObj.original}):</strong> ${tenObj.nums.join('+')} = <b>${tenObj.sum}</b> (Đầu:${tenObj.first}, Cuối:${tenObj.last})</div>`;

    document.getElementById("resultArea").innerHTML = `
        <div class="summary-banner">
            <h3 style="color:var(--primary-red); font-family:'Playfair Display',serif;">
                Danh Xưng: ${hoObj.original} ${demObjs.map(d => d.original).join(' ')} ${tenObj.original} (${gioiTinh === 'nam' ? 'Nam' : 'Nữ'})
            </h3>
            <div class="letter-breakdown">${chipsHtml}</div>
        </div>

        <div class="cuc-section">
            <div class="cuc-header"><h2>1. MỆNH CỤC (Bản Mệnh)</h2></div>
            <div class="cuc-body">
                <div class="sub-cuc-card"><div class="sub-cuc-title"><h3>Tĩnh Cục (Gốc)</h3><span class="cuc-number-badge" onclick="moTrangRiengCuc(${menhTinh})">Cục ${menhTinh}</span></div>
                    ${renderChiTietCuc(menhTinh, "menh")}
                </div>
                <div class="sub-cuc-card"><div class="sub-cuc-title"><h3>Động Cục (Ngọn)</h3><span class="cuc-number-badge" onclick="moTrangRiengCuc(${menhDong})">Cục ${menhDong}</span></div>
                    ${renderChiTietCuc(menhDong, "menh")}
                </div>
                <div class="tuong-quan-box"><strong>⚖️ Luận tương quan Tĩnh - Động:</strong><br>${danhGiaTuongQuanMenh(menhTinh, menhDong)}</div>
            </div>
        </div>

        <div class="cuc-section">
            <div class="cuc-header"><h2>2. VẬN CỤC (Vận Thế)</h2></div>
            <div class="cuc-body">
                <div class="sub-cuc-card"><div class="sub-cuc-title"><h3>Tiền Vận (≤ 30 tuổi)</h3><span class="cuc-number-badge" onclick="moTrangRiengCuc(${tienVan})">Cục ${tienVan}</span></div>
                    ${renderChiTietCuc(tienVan, "van")}
                </div>
                <div class="sub-cuc-card"><div class="sub-cuc-title"><h3>Hậu Vận (> 30 tuổi)</h3><span class="cuc-number-badge" onclick="moTrangRiengCuc(${hauVan})">Cục ${hauVan}</span></div>
                    ${renderChiTietCuc(hauVan, "van")}
                </div>
            </div>
        </div>

        <div class="cuc-section">
            <div class="cuc-header"><h2>3. PHÚC ĐỨC CỤC (Âm Phần)</h2></div>
            <div class="cuc-body">
                <div class="sub-cuc-card"><div class="sub-cuc-title"><h3>Phúc Đức Tĩnh Cục</h3><span class="cuc-number-badge" onclick="moTrangRiengCuc(${phucTinh})">Cục ${phucTinh}</span></div>
                    ${renderChiTietCuc(phucTinh, "phuc_duc")}
                </div>
                <div class="sub-cuc-card"><div class="sub-cuc-title"><h3>Phúc Đức Động Cục</h3><span class="cuc-number-badge" onclick="moTrangRiengCuc(${phucDongObj.final})">Cục ${phucDongObj.final}</span></div>
                    ${renderChiTietCuc(phucDongObj.final, "phuc_duc")}
                </div>
            </div>
        </div>

        <div class="cuc-section">
            <div class="cuc-header"><h2>4. TỬ TỨC CỤC (Con Cái)</h2></div>
            <div class="cuc-body">
                <div class="sub-cuc-card"><div class="sub-cuc-title"><h3>Tử Tức Tĩnh Cục</h3><span class="cuc-number-badge" onclick="moTrangRiengCuc(${tuTinh})">Cục ${tuTinh}</span></div>
                    ${renderChiTietCuc(tuTinh, "tu_tuc")}
                </div>
                <div class="sub-cuc-card"><div class="sub-cuc-title"><h3>Tử Tức Động Cục</h3><span class="cuc-number-badge" onclick="moTrangRiengCuc(${tuDongObj.final})">Cục ${tuDongObj.final}</span></div>
                    ${renderChiTietCuc(tuDongObj.final, "tu_tuc")}
                </div>
            </div>
        </div>
    `;
}

function renderDanhSach81Cuc() {
    let html = "";
    for (let i = 1; i <= 81; i++) {
        const d = window.DATA_81_CUC[i];
        const hasData = kiemTraCucDaCoDuLieu(i);
        const ten = (hasData && d.ten) ? d.ten : "Chưa nhập dữ liệu";
        const pl = (hasData && d.phan_loai) ? d.phan_loai : "Trống";
        const badgeClass = hasData ? layMauBadge(d.phan_loai) : "bg-none";
        html += `<div class="cuc-grid-item ${hasData ? 'has-data' : ''}" onclick="moTrangRiengCuc(${i})">
            <div><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <strong style="color:var(--primary-red); font-size:1.05rem;">Cục ${i}</strong><span class="badge-loai ${badgeClass}">${pl}</span></div>
            <div style="font-size:0.88rem; font-weight:700; color:#2c221e;">${ten}</div></div>
            <div style="font-size:0.75rem; color:#6b5a52; margin-top:8px; font-family:monospace;">📄 cuc/cuc${i}.js</div></div>`;
    }
    document.getElementById("grid81Area").innerHTML = html;
}

function moTrangRiengCuc(soCuc) {
    chuyenTab('tabSingle');
    const prev = soCuc > 1 ? soCuc - 1 : 81;
    const next = soCuc < 81 ? soCuc + 1 : 1;
    document.getElementById("singleCucArea").innerHTML = `
        <div class="single-cuc-page">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
                <button class="btn-open-page" style="font-size:0.95rem; margin-top:0;" onclick="chuyenTab('tabList')">← Trở về Danh sách 81 Cục</button>
                <div><button class="btn-open-page" style="margin-right:12px; margin-top:0;" onclick="moTrangRiengCuc(${prev})">◀ Cục ${prev}</button>
                <button class="btn-open-page" style="margin-top:0;" onclick="moTrangRiengCuc(${next})">Cục ${next} ▶</button></div>
            </div>
            <div class="file-path-tag">📁 File quản lý cục này: cuc/cuc${soCuc}.js</div>
            <h2 style="font-family:'Playfair Display',serif; color:var(--primary-red); border-bottom:2px solid var(--accent-gold); padding-bottom:10px; margin-bottom:15px;">TRANG CHI TIẾT CỤC SỐ ${soCuc}</h2>
            ${renderChiTietCuc(soCuc, "full")}
        </div>`;
}

function chuyenTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    if (tabId === 'tabCalc') document.getElementById('btnTabCalc').classList.add('active');
    if (tabId === 'tabList') document.getElementById('btnTabList').classList.add('active');
    if (tabId === 'tabSingle') document.getElementById('btnTabSingle').classList.add('active');
}

function taoNoiDungFileCuc(soCuc) {
    return `// =====================================================================\n// FILE DỮ LIỆU RIÊNG CỦA CỤC SỐ ${soCuc} (cuc/cuc${soCuc}.js)\n// =====================================================================\n\nwindow.DATA_81_CUC[${soCuc}] = {\n    "ten": "",\n    "ten_khac": "",\n    "phan_loai": "",\n    "mo_ta_chung": "",\n    "luan_chung": { "can_co": "", "gia_dinh": "", "suc_khoe": "", "nghe_nghiep": "", "phuc_duc": "", "con_cai": "", "tien_hau_van": "" },\n    "tinh_danh": { "dien_thuc_phan_thuc": "", "bat_tuong": "" }\n};\n`;
}

async function taoTuDong81File() {
    if (!window.showDirectoryPicker) { alert("Trình duyệt không hỗ trợ. Hãy mở bằng Chrome/Edge mới nhất!"); return; }
    try {
        const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        const cucFolder = await dirHandle.getDirectoryHandle('cuc', { create: true });
        for (let i = 1; i <= 81; i++) {
            const fileHandle = await cucFolder.getFileHandle(`cuc${i}.js`, { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(taoNoiDungFileCuc(i));
            await writable.close();
        }
        alert("✅ Đã tạo thư mục 'cuc/' cùng 81 file mẫu rỗng!"); nap81FileCuc();
    } catch (err) { if (err.name !== 'AbortError') alert("Có lỗi: " + err.message); }
}

function capNhatToanBoGiaoDien() { tinhTuDaiCuc(); renderDanhSach81Cuc(); moTrangRiengCuc(1); chuyenTab('tabCalc'); }
window.onload = function() { capNhatToanBoGiaoDien(); nap81FileCuc(); };
